name: release-assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag name to attach assets to (dry-run artifact upload if omitted)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package-release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify reproducible bundles
        run: node scripts/build.mjs --check
      - name: Self-test shell installer
        run: sh install.sh --self-test
      - name: Package extension, CLI, and SHA256SUMS
        run: |
          node scripts/package.mjs
          node -e '
            import { copyFileSync, readFileSync, writeFileSync } from "node:fs";
            import { join } from "node:path";
            import { cliZip } from "./scripts/cli-zip.mjs";
            const v = JSON.parse(readFileSync("src/ext/manifest.json", "utf8")).version;
            copyFileSync(join("dist", `cmmns-chrome-${v}.zip`), join("dist", "cmmns-ext.zip"));
            writeFileSync(join("dist", `cmmns-cli-${v}.zip`), cliZip());
            copyFileSync("install.ps1", join("dist", "install.ps1"));
            copyFileSync("install.sh", join("dist", "install.sh"));
          '
          (cd dist && sha256sum cmmns-ext.zip cmmns-chrome-*.zip cmmns-cli-*.zip cmmns-firefox-*.xpi FILES-*.sha256 install.ps1 install.sh > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Verify installer against freshly packaged dist/
        run: |
          sh install.sh --from-dir dist --install-dir "$RUNNER_TEMP/cmmns-smoke" --no-path
          test -f "$RUNNER_TEMP/cmmns-smoke/ext/manifest.json"
          test -x "$RUNNER_TEMP/cmmns-smoke/bin/cmmns"
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmmns-release-assets
          path: dist/*
      - name: Attach assets to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "CMMNS $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
