name: test
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Bundle matches a fresh build
        shell: bash
        run: |
          npm run build
          git diff --exit-code --ignore-cr-at-eol -- src/ext/core.bundle.js
