name: test
on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
# Every step here is scripts/ci.mjs, so `npm run ci` on any machine runs exactly what this runs and
# the project can check itself without GitHub (tests/ci.test.js keeps the two the same).
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci.mjs test
  c2pa-reference:
    # Daylight Commons' Content Credentials verdicts must never be more favourable than c2patool's on the
    # c2pa-rs test fixtures (MIT/Apache-2.0), fetched at a pinned commit and never committed here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci.mjs c2pa
  decisions:
    # Every challenge issue (label "challenge") has a public decision in catalogue/DECISIONS.md.
    # The token reads issues only.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci.mjs decisions
        env:
          GH_TOKEN: ${{ github.token }}
