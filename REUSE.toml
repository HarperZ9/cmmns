version = 1
SPDX-PackageName = "Daylight Commons"
SPDX-PackageDownloadLocation = "https://github.com/HarperZ9/daylight-commons"

# Which licence covers which files. When several entries match a file, the last one wins.
# Code is AGPL-3.0-only. Data, the catalogue, schemas and documentation are CC BY 4.0.
# Third-party files keep their own licences; THIRD-PARTY.md lists them with their notices.

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Zain Dana Harper and the Daylight Commons contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
  "*.md",
  "project-docs/**",
  "data/**",
  "catalogue/**",
  "src/core/catalogue-data.js",
  "schema/**",
  "docs/*.html",
  "docs/release-key.json",
  "src/ext/*.json",
  "src/ext/discourse/*.json",
  "assets/**",
  "examples/**",
]
SPDX-FileCopyrightText = "2026 Zain Dana Harper and the Daylight Commons contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["src/ext/manifest.json", "package.json", "src/ext/LICENSE.txt", "LICENSE"]
SPDX-FileCopyrightText = "2026 Zain Dana Harper and the Daylight Commons contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = "data/snapshots/unicode-confusables.txt"
SPDX-FileCopyrightText = "1991-2026 Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"

[[annotations]]
path = ["src/ext/fonts/AccessionStencil.woff2", "src/ext/fonts/OFL-accession.txt"]
SPDX-FileCopyrightText = "2026 Zain Dana Harper"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/ext/fonts/hanken-grotesk.woff2", "docs/fonts/hanken-grotesk.woff2", "src/ext/fonts/OFL-hanken-grotesk.txt", "docs/fonts/OFL-hanken-grotesk.txt"]
SPDX-FileCopyrightText = "2021 The Hanken Grotesk Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/ext/fonts/jetbrains-mono-regular.woff2", "docs/fonts/jetbrains-mono-regular.woff2", "src/ext/fonts/OFL-jetbrains-mono.txt", "docs/fonts/OFL-jetbrains-mono.txt"]
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# EasyList and EasyPrivacy, dual-licensed GPL-3.0-or-later or CC BY-SA 3.0 or later by their
# authors; Daylight Commons ships the compiled rules under the GPL option (THIRD-PARTY.md).
[[annotations]]
path = ["src/ext/rules/easylist.json", "src/ext/rules/easyprivacy.json"]
SPDX-FileCopyrightText = "The EasyList authors <https://easylist.to/>"
SPDX-License-Identifier = "GPL-3.0-or-later"
