<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar site record</title>
<link rel="stylesheet" href="canon.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Site record</h1>
    <p class="lead" id="line">Reading Radar's tables…</p>
    <dl id="facts" class="facts"></dl>
  </header>
  <section aria-labelledby="h-reviews">
    <h2 id="h-reviews">Reviews that list this site as where a claim appeared</h2>
    <p class="muted" id="dnp"></p>
    <div class="scroll">
      <table>
        <thead><tr><th scope="col">Date</th><th scope="col">Fact-checker</th><th scope="col">Their rating</th><th scope="col">Claim they reviewed</th><th scope="col">Review</th></tr></thead>
        <tbody id="reviews"></tbody>
      </table>
    </div>
    <p class="muted" id="more"></p>
  </section>
  <footer class="muted" id="credit"></footer>
</main>
<script src="core.bundle.js"></script>
<script src="sites.js"></script>
</body>
</html>
