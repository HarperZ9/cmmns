<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study boards · CMMNS</title>
<link rel="stylesheet" href="canon.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="media.css">
<link rel="stylesheet" href="boards.css">
</head>
<body>
<main class="wide">
  <header>
    <h1>Study boards</h1>
  </header>
  <section aria-labelledby="h-from" class="bare">
    <h2 id="h-from" class="sr-only">Plates from</h2>
    <div class="toolbar">
      <span class="pair"><label for="source">Plates from</label> <select id="source"></select></span>
      <button id="folder" type="button">Choose a folder of saves</button>
      <span class="pair"><label for="site">Site</label> <select id="site"><option value="">All</option></select></span>
      <label><input id="study" type="checkbox"> Study saves only</label>
    </div>
    <div class="toolbar">
      <span class="pair"><label for="title">Title</label> <input id="title" type="text" maxlength="120"></span>
      <span class="pair"><label for="lane">Lane</label> <input id="lane" type="text" maxlength="60" list="lanes"></span>
      <datalist id="lanes"></datalist>
      <span class="pair"><label for="keywords">Keywords</label> <input id="keywords" type="text" maxlength="200"></span>
      <span class="pair"><label for="layout">Layout</label> <select id="layout"><option value="book">Book</option><option value="grid">Grid</option><option value="timeline">Timeline</option></select></span>
      <span class="pair"><label for="head">Heads</label> <select id="head"><option value="grotesk">Hanken Grotesk</option><option value="accession">Accession Stencil</option><option value="mono">JetBrains Mono</option></select></span>
    </div>
    <div class="toolbar">
      <button id="print" type="button">Print or save as PDF</button>
      <button id="page" type="button">Save as one web page</button>
      <button id="write" type="button" hidden>Save as a folder</button>
      <p id="status" class="muted" role="status" aria-live="polite"></p>
    </div>
  </section>
  <iframe id="view" title="The board"></iframe>
</main>
<script src="core.bundle.js"></script>
<script src="guard.js"></script>
<script src="settings.js"></script>
<script src="media-store.js"></script>
<script src="boards-read.js"></script>
<script src="boards.js"></script>
</body>
</html>
