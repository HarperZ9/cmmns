<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daylight Commons</title>
<link rel="stylesheet" href="canon.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><h1>Daylight Commons</h1><span id="site"></span></header>
<main>
  <p id="sentence" class="lead">Open a post or a feed on X, YouTube, Reddit, Facebook, Instagram, Bluesky, Threads, TikTok or a Mastodon server.</p>
  <section id="server" class="server bare" hidden>
    <p id="server-text"></p>
    <button id="server-on" type="button">Turn on Daylight Commons here</button>
  </section>
  <dl id="facts"></dl>
  <div class="actions">
    <button id="scan" type="button">Read all accounts</button>
    <button id="panel" type="button">Open thread panel</button>
    <button id="export" type="button">Save report</button>
    <button id="dashboard" type="button">Your feed</button>
    <button id="sitecard" type="button">Site card for this page</button>
    <button id="selftest-run" type="button">Self-test on this page</button>
    <button id="history" type="button">Open history</button>
    <button id="analyze" type="button">Analyse a file</button>
    <button id="case-add" type="button">Add to case</button>
    <button id="case-save" type="button">Save case list</button>
    <button id="options" type="button">Options</button>
    <button id="transparency" type="button">How Daylight Commons is measured</button>
  </div>
  <dl id="selftest" class="selftest" hidden></dl>
  <section class="settings bare">
    <label><input type="checkbox" id="paused"> Pause Daylight Commons</label>
    <label><input type="checkbox" id="feeds"> Daylight Commons on feeds and profiles</label>
    <label><input type="checkbox" id="auto"> Read About pages automatically</label>
  </section>
  <p id="freshness" class="muted"></p>
</main>
<footer>Daylight Commons reads the site you are on. Other coverage and evidence lookups reach further once you turn them on.</footer>
<script src="core.bundle.js"></script>
<script src="guard.js"></script>
  <script src="settings.js"></script>
<script src="popup-server.js"></script>
<script src="case-inbox.js"></script>
<script src="freshness.js"></script>
<script src="popup.js"></script>
</body>
</html>
