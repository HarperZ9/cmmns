<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radar</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><strong>Radar</strong><span id="site"></span></header>
<main>
  <p id="sentence" class="lead">Open a post or a feed on X, YouTube or Reddit.</p>
  <dl id="facts"></dl>
  <div class="actions">
    <button id="scan" type="button">Read all accounts</button>
    <button id="panel" type="button">Open thread panel</button>
    <button id="export" type="button">Save report</button>
    <button id="history" type="button">Open history</button>
  </div>
  <section class="settings">
    <label><input type="checkbox" id="feeds"> Pills on feeds and profiles</label>
    <label><input type="checkbox" id="auto"> Read About pages automatically</label>
  </section>
</main>
<footer>Evidence, not verdicts. Nothing leaves this browser.</footer>
<script src="popup.js"></script>
</body>
</html>
