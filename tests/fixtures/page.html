<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radar page fixture</title>
</head>
<body>
<script>
// Opens one of Radar's own pages (src/ext/<name>.html) in an ordinary tab, with the invented
// sample data from feed-data.js and a stand-in for the extension APIs, so every page can be
// looked at and screenshotted without loading the extension.
//   http://127.0.0.1:8742/tests/fixtures/page.html?p=welcome
(async () => {
  const name = (new URLSearchParams(location.search).get("p") || "welcome").replace(/[^a-z-]/g, "");
  const hash = location.hash;
  const manifest = await (await fetch("../../src/ext/manifest.json")).json();
  const html = await (await fetch(`../../src/ext/${name}.html`)).text();
  const stub = `<base href="${new URL("../../src/ext/", location.href)}">
<script src="${new URL("feed-data.js", location.href)}"><\/script>
<script src="${new URL("chrome-stub.js", location.href)}"><\/script>
<script>
  chrome.runtime.getManifest = () => (${JSON.stringify(manifest)});
  chrome.runtime.getURL = (p) => new URL(p, document.baseURI).href;
  chrome.runtime.openOptionsPage = async () => {};
  chrome.permissions = { request: async () => false, contains: async () => false };
  chrome.tabs = { query: async () => [], create: async () => ({}), sendMessage: async () => null };
  history.replaceState(null, "", location.pathname + location.search + ${JSON.stringify(hash)});
<\/script>`;
  document.open();
  document.write(html.replace(/<head>/i, "<head>" + stub));
  document.close();
})();
</script>
</body>
</html>
