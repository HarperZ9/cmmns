</main>
<script>
  // [handle, text, aboutReading or null (not looked up), preloaded?]
  const T = [
    ["newsdesk_fr", "Thousands marched in Paris today against the pension reform. Police report clashes near Place de la Nation.", { basedIn: "France", joinDate: "2011-04-01", nameChanges: 0 }, true],
    ["claire_lyon", "I was at the march in Lyon, it was calm and full of families until the very end.", { basedIn: "France", joinDate: "2014-02-01", nameChanges: 0 }, true],

    ["truth_now_77", "The protests are paid for by foreign money and the media will never tell you that!!", { basedIn: "South Asia", joinDate: "2026-09-28", nameChanges: 1 }, false],

    ["Jean20995511", "As a Frenchman I can tell you these rioters are vermin and they should all be shot", { basedIn: "West Asia", joinDate: "2026-10-09", nameChanges: 0 }, true],
    ["redflag_now", "billionaires are parasites, bring out the guillotines for the billionaires", { basedIn: "United States", joinDate: "2026-10-12", nameChanges: 2 }, false],
    ["marc_dupont", "My grandmother marched in 1995 too. Same fight, different decade.", { basedIn: "France", joinDate: "2012-09-01", nameChanges: 0 }, true],
    ["sophie_t", "The reform is a mistake but the violence near the end did not help anyone.", { basedIn: "Europe", joinDate: "2016-05-01", nameChanges: 0 }, false],
    ["paul_b", "Strikes are planned again for Thursday according to the unions.", null, false],
    ["skywatch_lou", "Look up over Paris today, those are chemtrails and they are spraying us.", { basedIn: "France", joinDate: "2019-03-01", nameChanges: 0 }, true],
    ["BBC_Breaking_24", "Breaking: the minister has resigned, more soon.", { basedIn: "France", joinDate: "2026-09-30", nameChanges: 2 }, true],
  ];
  window.FIXTURE_ABOUT = Object.fromEntries(T.filter((t) => t[2]).map((t) => [t[0], t[2]]));
  // Invented reply times, to the second: a reply every few minutes, and five within ten seconds.
  const at = (i) => new Date(Date.UTC(2026, 9, 29, 12, 0, 0) + (i >= 4 && i <= 8 ? 1500 + (i - 4) * 2 : i * 263 + (i % 5) * 7) * 1000).toISOString();
  const box = document.getElementById("thread");
  T.forEach(([h, text], i) => {
    const a = document.createElement("article");
    a.setAttribute("data-testid", "tweet");
    a.tabIndex = 0;   // X's posts take keyboard focus
    a.innerHTML = `<div data-testid="User-Name"><a href="/${h}">${h.replace(/_/g, " ")}</a> <span>@${h} · <a href="/${h}/status/10${i}"><time datetime="${at(i)}">2h</time></a></span></div><div data-testid="tweetText"></div>`;
    a.querySelector('[data-testid="tweetText"]').textContent = text;
    // A synthetic image signed with test Content Credentials (tests/fixtures/c2pa), for the media rows.
    if (i === 1) { const img = document.createElement("img"); img.src = "c2pa/ai.jpg"; img.width = 240; img.height = 240; img.alt = "synthetic test image"; a.append(img); }
    // A screenshot of a made-up post (tests/fixtures/ocr), for "Read text in this image".
    if (i === 4) { const img = document.createElement("img"); img.src = "ocr/post.png"; img.width = 560; img.height = 150; img.alt = "screenshot of a made-up post"; a.append(img); }
    box.append(a);
  });
  window.FIXTURE_PRELOAD = T.filter((t) => t[2] && t[3]).map((t) => ({ handle: t[0], ...t[2] }));
</script>
