<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daylight Commons history fixture</title>
<link rel="stylesheet" href="../../src/ext/history.css">
</head>
<body>
<header><h1>Daylight Commons history</h1><p id="scope" class="muted"></p></header>
<main id="main"></main>
<script src="feed-data.js"></script>
<script src="chrome-stub.js"></script>
<script>
// Load the real page body, then its scripts, so the fixture shows exactly what ships.
fetch("../../src/ext/history.html").then((r) => r.text()).then((html) => {
  const doc = new DOMParser().parseFromString(html, "text/html");
  document.body.querySelectorAll("header, main").forEach((n) => n.remove());
  document.body.prepend(doc.querySelector("header"), doc.querySelector("main"));
  for (const src of ["../../src/ext/core.bundle.js", "../../src/ext/history-graph.js", "../../src/ext/history.js"]) { const s = document.createElement("script"); s.src = src; s.async = false; document.body.append(s); }
});
</script>
</body>
</html>
